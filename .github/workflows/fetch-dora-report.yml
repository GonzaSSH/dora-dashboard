# One-off: read sources the Claude Code session can't reach (here: DORA's 2025 benchmark data).
name: Fetch DORA 2025 report
on:
  push:
    branches: [claude/fetch-dora-report]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Read the 2025 DORA report PDF (Google-hosted)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
          curl -sSL https://services.google.com/fh/files/misc/2025_state_of_ai_assisted_software_development.pdf -o r.pdf -w "HTTP %{http_code}\n"
          pdfinfo r.pdf | head -12
          pdftotext -layout r.pdf r.txt
          awk 'BEGIN{p=1} /\f/{p++} {print "p"p": "$0}' r.txt > n.txt
          echo "=== licence / copyright lines"; grep -i -E 'creative commons|CC BY|licen|copyright|©' n.txt | head -15
          echo "=== pages mentioning deployment frequency or lead time with percentages"
          grep -i -E 'deployment frequency|lead time|deploy' n.txt | grep -E '[0-9]+(\.[0-9])?%' | head -40
          echo "=== pages with frequency answer options"
          grep -i -E 'on demand|once per (day|week|month)|between once|fewer than once|more than once' n.txt | head -60
