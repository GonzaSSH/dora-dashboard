# One-off: read pages the Claude Code session can't reach (here: Swarmia's help centre).
name: Fetch DORA 2025 report
on:
  push:
    branches: [claude/fetch-dora-report]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Swarmia change failure rate docs
        run: |
          for u in https://linearb.helpdocs.io/article/bqkxf4rjom-what-is-cfr; do
            echo "################ $u"
            curl -sSL --max-time 30 "$u" | python3 -c "
          import sys,re,html
          t=sys.stdin.read()
          t=re.sub(r'(?s)<(script|style)[^>]*>.*?</\1>','',t)
          t=html.unescape(re.sub(r'<[^>]+>','\n',t))
          lines=[l.strip() for l in t.split('\n') if l.strip()]
          print('\n'.join(l for l in lines if re.search(r'(?i)incident|deploy|failure|bug|defin|calculat',l))[:6000])"
          done
